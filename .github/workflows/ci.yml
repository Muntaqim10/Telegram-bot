name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest ruff

      # The configured rule set (E,F,I,B,C4,UP,S) has a large untriaged backlog, so CI
      # gates on the rules that catch real bugs. Widen this as the backlog is cleared.
      - name: Lint
        run: ruff check src/ scripts/ tests/ --select F821,F841

      # data/ is gitignored, so there is no trained model here and the suites that need
      # one skip themselves. Everything else must pass.
      - name: Tests
        run: pytest tests/ -q
